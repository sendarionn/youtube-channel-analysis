[project]
name = "ycanalysis"
version = "0.1.0"
description = "YouTubeチャンネルの成長要因を分析するための収集・集計・可視化ツール"
requires-python = ">=3.12"
dependencies = [
  "pandas",
  "numpy",
  "scipy",
  "statsmodels",
  "matplotlib",
  "pillow",
  "requests",
  "python-dotenv",
  "yt-dlp",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
